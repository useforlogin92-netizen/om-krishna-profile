<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Public Chat | OM Krishna Group</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1220;
  color:#eef2ff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:64px;
  background:#111827;
  border-bottom:1px solid #263247;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.brand{
  font-weight:800;
  font-size:20px;
}

.brand span{
  color:#d4af37;
}

button{
  cursor:pointer;
}

.gold{
  background:#d4af37;
  color:#111;
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font-weight:700;
}

.wrap{
  max-width:850px;
  margin:28px auto;
  padding:0 16px;
}

.panel{
  background:#111827;
  border:1px solid #263247;
  border-radius:16px;
  overflow:hidden;
}

/* START SCREEN */

.start{
  padding:28px;
}

.targets{
  display:flex;
  gap:14px;
  margin:20px 0;
}

.target{
  flex:1;
  padding:22px;
  border:1px solid #334155;
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  text-align:left;
}

.target.selected{
  border-color:#d4af37;
  box-shadow:0 0 0 1px #d4af37;
}

.form{
  display:none;
  gap:12px;
  max-width:620px;
}

.form input{
  background:#0b1220;
  color:#fff;
  border:1px solid #334155;
  border-radius:8px;
  padding:12px;
  width:100%;
}

.chat{
  display:none;
  height:650px;
  grid-template-rows:auto auto 1fr auto;
}

.chathead{
  padding:17px 20px;
  border-bottom:1px solid #263247;
}

.connection{
  padding:10px 20px;
  border-bottom:1px solid #263247;
  color:#8fb5d8;
  font-size:13px;
}

.messages{
  padding:20px;
  overflow:auto;
}

.msg{
  max-width:72%;
  margin:8px 0;
  padding:10px 13px;
  border-radius:12px;
  background:#1b2638;
}

.mine{
  margin-left:auto;
  background:#29485b;
}

.sender{
  font-size:12px;
  font-weight:700;
  color:#d4af37;
  margin-bottom:4px;
}

.meta{
  font-size:11px;
  color:#94a3b8;
  margin-top:5px;
}

.composer{
  padding:14px;
  border-top:1px solid #263247;
  display:flex;
  gap:8px;
}

.composer input{
  flex:1;
  background:#0b1220;
  color:#fff;
  border:1px solid #334155;
  border-radius:9px;
  padding:12px;
}

.error{
  color:#ffb4b4;
  background:#35191b;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
}

.muted{
  color:#94a3b8;
  font-size:13px;
}

.restore{
  background:#102238;
  border:1px solid #29445f;
  color:#b9d5ef;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
}

@media(max-width:650px){

  .targets{
    flex-direction:column;
  }

  .chat{
    height:calc(100vh - 92px);
  }

  .msg{
    max-width:88%;
  }

}

</style>

</head>

<body>

<header>

  <div class="brand">
    OM <span>Krishna</span> Group · Chat
  </div>

  <button
    class="gold"
    onclick="location.href='index.html'">
    Back
  </button>

</header>


<div class="wrap">

<div class="panel">


<!-- =====================================================
     START
====================================================== -->

<section
  id="start"
  class="start">

  <h1>
    Who would you like to connect with?
  </h1>

  <p class="muted">
    Choose one: OM or Krishna.
  </p>


  <div class="targets">

    <button
      id="omBtn"
      class="target"
      onclick="selectTarget('om')">

      <b>🟢 OM</b>
      <br>

      <span class="muted">
        Connect with OM
      </span>

    </button>


    <button
      id="krishnaBtn"
      class="target"
      onclick="selectTarget('krishna')">

      <b>🔵 Krishna</b>
      <br>

      <span class="muted">
        Connect with Krishna
      </span>

    </button>

  </div>


  <div
    id="restoreBox"
    class="restore"
    style="display:none">

    Previous conversation found.
    Restoring your chat...

  </div>


  <div
    id="form"
    class="form">

    <input
      id="name"
      placeholder="Full Name *">

    <input
      id="email"
      type="email"
      placeholder="Email Address *">

    <input
      id="mobile"
      placeholder="Mobile Number *">

    <button
      class="gold"
      onclick="startChat()">

      Start Chat

    </button>


    <div
      id="error"
      class="error"
      style="display:none">
    </div>

  </div>

</section>


<!-- =====================================================
     CHAT
====================================================== -->

<section
  id="chat"
  class="chat">


  <div class="chathead">

    <b id="title">
    </b>

    <div
      id="visitorInfo"
      class="muted">
    </div>

  </div>


  <div
    id="connection"
    class="connection">

    Connecting...

  </div>


  <div
    id="messages"
    class="messages">
  </div>


  <div class="composer">

    <input
      id="message"
      placeholder="Type a message..."
      onkeydown="if(event.key==='Enter') sendMessage()">

    <button
      class="gold"
      onclick="sendMessage()">

      Send

    </button>

  </div>


</section>


</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://keehbqlaxiojtkpldgry.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_lF6xTN15-1DNx_mszaZdJQ_QHlIj10T";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let target = null;
let conversationId = null;
let userId = null;
let channel = null;

const STORAGE_KEY =
  "omkrishna_public_chat";


/* =========================================================
   ELEMENTS
========================================================= */

const startEl =
  document.getElementById("start");

const chatEl =
  document.getElementById("chat");

const formEl =
  document.getElementById("form");

const errorEl =
  document.getElementById("error");

const messagesEl =
  document.getElementById("messages");

const titleEl =
  document.getElementById("title");

const connectionEl =
  document.getElementById("connection");

const nameEl =
  document.getElementById("name");

const emailEl =
  document.getElementById("email");

const mobileEl =
  document.getElementById("mobile");


/* =========================================================
   ERROR
========================================================= */

function showError(text){

  errorEl.textContent = text;

  errorEl.style.display = "block";

}


/* =========================================================
   SELECT OM / KRISHNA
========================================================= */

function selectTarget(t){

  target = t;

  document
    .getElementById("omBtn")
    .classList.toggle(
      "selected",
      t === "om"
    );

  document
    .getElementById("krishnaBtn")
    .classList.toggle(
      "selected",
      t === "krishna"
    );

  formEl.style.display =
    "grid";

}


/* =========================================================
   ANONYMOUS SESSION
========================================================= */

async function getVisitorSession(){

  const {
    data,
    error
  } = await sb.auth.getSession();


  if(error){

    throw error;

  }


  if(data.session){

    return data.session.user;

  }


  const {
    data:anonymousData,
    error:anonymousError
  } =
    await sb.auth.signInAnonymously();


  if(anonymousError){

    throw anonymousError;

  }


  return anonymousData.user;

}


/* =========================================================
   SAVE CHAT STATE
========================================================= */

function saveChatState(){

  const state = {

    conversationId:
      conversationId,

    target:
      target,

    name:
      nameEl.value.trim(),

    email:
      emailEl.value.trim(),

    mobile:
      mobileEl.value.trim()

  };


  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================================================
   GET SAVED CHAT
========================================================= */

function getSavedChat(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){

      return null;

    }

    return JSON.parse(raw);

  }

  catch{

    return null;

  }

}


/* =========================================================
   SHOW CHAT
========================================================= */

function showChat(){

  startEl.style.display =
    "none";

  chatEl.style.display =
    "grid";


  titleEl.textContent =
    "Chat with " +
    (
      target === "om"
        ? "OM"
        : "Krishna"
    );


  document
    .getElementById("visitorInfo")
    .textContent =
      nameEl.value.trim()
      + " • "
      + emailEl.value.trim()
      + " • "
      + mobileEl.value.trim();

}


/* =========================================================
   START NEW CHAT
========================================================= */

async function startChat(){

  errorEl.style.display =
    "none";


  const name =
    nameEl.value.trim();

  const email =
    emailEl.value.trim();

  const mobile =
    mobileEl.value.trim();


  if(
    !target ||
    !name ||
    !email ||
    !mobile
  ){

    showError(
      "Please select OM/Krishna and enter Full Name, Email and Mobile."
    );

    return;

  }


  try{

    const u =
      await getVisitorSession();


    userId =
      u.id;


    /*
     * Create conversation.
     */

    const {
      data,
      error
    } =
      await sb

        .from("conversations")

        .insert({

          conversation_type:
            "public",

          public_target:
            target,

          public_name:
            name,

          public_email:
            email,

          public_mobile:
            mobile,

          created_by:
            u.id

        })

        .select(
          "id,target_user_id"
        )

        .single();


    if(error){

      throw error;

    }


    conversationId =
      data.id;


    /*
     * Save everything locally.
     * Refresh will NOT lose the chat.
     */

    saveChatState();


    showChat();


    await loadMessages();

    subscribeToMessages();


    document
      .getElementById("message")
      .focus();

  }

  catch(e){

    console.error(e);

    showError(
      e.message ||
      "Unable to start chat."
    );

  }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  const {
    data,
    error
  } =
    await sb

      .from("messages")

      .select("*")

      .eq(
        "conversation_id",
        conversationId
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    showError(
      error.message
    );

    return;

  }


  messagesEl.innerHTML =
    "";


  data.forEach(
    message =>
      addMessage(
        message
      )
  );

}


/* =========================================================
   REALTIME SUBSCRIPTION
========================================================= */

function subscribeToMessages(){

  if(!conversationId){

    return;

  }


  /*
   * Remove old channel first.
   */

  if(channel){

    sb.removeChannel(
      channel
    );

  }


  connectionEl.textContent =
    "Connecting...";


  channel =

    sb

      .channel(
        "public-chat-" +
        conversationId +
        "-" +
        Date.now()
      )

      .on(

        "postgres_changes",

        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },

        payload => {

          /*
           * Do not duplicate our own
           * message because sendMessage()
           * already adds it.
           */

          if(
            payload.new.sender_id !==
            userId
          ){

            addMessage(
              payload.new
            );

          }

        }

      )

      .subscribe(

        status => {

          if(
            status ===
            "SUBSCRIBED"
          ){

            connectionEl.textContent =
              "Live • Connected";

          }

          else if(
            status ===
            "CHANNEL_ERROR"
          ){

            connectionEl.textContent =
              "Live connection error";

          }

          else{

            connectionEl.textContent =
              "Live • " +
              status;

          }

        }

      );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  const input =
    document.getElementById(
      "message"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(
    !conversationId ||
    !userId
  ){

    alert(
      "Chat session is not ready. Please start the chat again."
    );

    return;

  }


  const {
    data,
    error
  } =
    await sb

      .from("messages")

      .insert({

        conversation_id:
          conversationId,

        sender_id:
          userId,

        sender_name:
          nameEl.value.trim(),

        message_text:
          text,

        message_type:
          "text"

      })

      .select()

      .single();


  if(error){

    alert(
      error.message
    );

    return;

  }


  addMessage(
    data
  );


  input.value =
    "";

}


/* =========================================================
   DISPLAY MESSAGE
========================================================= */

function addMessage(m){

  /*
   * Prevent duplicate display.
   */

  const existing =
    document.querySelector(
      '[data-message-id="' +
      m.id +
      '"]'
    );


  if(existing){

    return;

  }


  const d =
    document.createElement(
      "div"
    );


  d.className =
    "msg " +
    (
      m.sender_id === userId
        ? "mine"
        : ""
    );


  d.dataset.messageId =
    m.id;


  const sender =
    document.createElement(
      "div"
    );


  sender.className =
    "sender";


  sender.textContent =
    m.sender_name ||
    (
      m.sender_id === userId
        ? nameEl.value.trim()
        : "OM / Krishna"
    );


  const body =
    document.createElement(
      "div"
    );


  body.textContent =
    m.message_text ||
    "";


  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "meta";


  meta.textContent =
    new Date(
      m.created_at
    ).toLocaleString(
      "en-IN"
    );


  d.append(
    sender,
    body,
    meta
  );


  messagesEl.appendChild(
    d
  );


  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* =========================================================
   RESTORE CHAT AFTER PAGE REFRESH
========================================================= */

async function restoreChat(){

  const saved =
    getSavedChat();


  if(
    !saved ||
    !saved.conversationId ||
    !saved.target
  ){

    return;

  }


  document
    .getElementById(
      "restoreBox"
    )
    .style.display =
      "block";


  try{

    const u =
      await getVisitorSession();


    userId =
      u.id;


    /*
     * Verify that this conversation
     * really belongs to this browser's
     * anonymous account.
     */

    const {
      data:conversation,
      error
    } =
      await sb

        .from("conversations")

        .select(
          "id,conversation_type,public_target,public_name,public_email,public_mobile,created_by"
        )

        .eq(
          "id",
          saved.conversationId
        )

        .eq(
          "created_by",
          userId
        )

        .maybeSingle();


    if(error){

      throw error;

    }


    if(!conversation){

      /*
       * Old/invalid local conversation.
       */

      localStorage.removeItem(
        STORAGE_KEY
      );

      document
        .getElementById(
          "restoreBox"
        )
        .style.display =
          "none";

      return;

    }


    /*
     * Restore state.
     */

    conversationId =
      conversation.id;

    target =
      conversation.public_target;


    nameEl.value =
      conversation.public_name ||
      saved.name ||
      "";

    emailEl.value =
      conversation.public_email ||
      saved.email ||
      "";

    mobileEl.value =
      conversation.public_mobile ||
      saved.mobile ||
      "";


    document
      .getElementById(
        "restoreBox"
      )
      .style.display =
        "none";


    showChat();


    await loadMessages();

    subscribeToMessages();

  }

  catch(e){

    console.error(
      "RESTORE ERROR:",
      e
    );

    document
      .getElementById(
        "restoreBox"
      )
      .style.display =
        "none";

  }

}


/* =========================================================
   PAGE START
========================================================= */

restoreChat();

</script>

</body>
</html>
