<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Public Chat | OM Krishna Group</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1220;
  color:#eef2ff;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:64px;
  background:#111827;
  border-bottom:1px solid #263247;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
}

.brand{
  font-weight:800;
  font-size:20px;
}

.brand span{
  color:#d4af37;
}

button{
  cursor:pointer;
}

.gold{
  background:#d4af37;
  color:#111;
  border:0;
  border-radius:8px;
  padding:11px 18px;
  font-weight:700;
}

.wrap{
  max-width:850px;
  margin:28px auto;
  padding:0 16px;
}

.panel{
  background:#111827;
  border:1px solid #263247;
  border-radius:16px;
  overflow:hidden;
}

/* ================= START ================= */

.start{
  padding:28px;
}

.targets{
  display:flex;
  gap:14px;
  margin:20px 0;
}

.target{
  flex:1;
  padding:22px;
  border:1px solid #334155;
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  text-align:left;
}

.target.selected{
  border-color:#d4af37;
  box-shadow:0 0 0 1px #d4af37;
}

.form{
  display:none;
  gap:12px;
  max-width:620px;
}

.form input{
  background:#0b1220;
  color:#fff;
  border:1px solid #334155;
  border-radius:8px;
  padding:12px;
  width:100%;
}

.error{
  color:#ffb4b4;
  background:#35191b;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
}

.info{
  color:#b9d5ef;
  background:#102238;
  border:1px solid #29445f;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  font-size:13px;
}

.muted{
  color:#94a3b8;
  font-size:13px;
}

/* ================= CHAT ================= */

.chat{
  display:none;
  height:650px;
  grid-template-rows:auto auto 1fr auto;
}

.chathead{
  padding:17px 20px;
  border-bottom:1px solid #263247;
}

.connection{
  padding:10px 20px;
  border-bottom:1px solid #263247;
  color:#8fb5d8;
  font-size:13px;
}

.messages{
  padding:20px;
  overflow:auto;
}

.msg{
  max-width:72%;
  margin:8px 0;
  padding:10px 13px;
  border-radius:12px;
  background:#1b2638;
}

.mine{
  margin-left:auto;
  background:#29485b;
}

.sender{
  font-size:12px;
  font-weight:700;
  color:#d4af37;
  margin-bottom:4px;
}

.meta{
  font-size:11px;
  color:#94a3b8;
  margin-top:5px;
}

.composer{
  padding:14px;
  border-top:1px solid #263247;
  display:flex;
  gap:8px;
}

.composer input{
  flex:1;
  background:#0b1220;
  color:#fff;
  border:1px solid #334155;
  border-radius:9px;
  padding:12px;
}

.composer button{
  min-width:70px;
}

@media(max-width:650px){

  .targets{
    flex-direction:column;
  }

  .chat{
    height:calc(100vh - 92px);
  }

  .msg{
    max-width:88%;
  }

}

</style>

</head>

<body>

<header>

  <div class="brand">
    OM <span>Krishna</span> Group · Chat
  </div>

  <button
    class="gold"
    onclick="location.href='index.html'">
    Back
  </button>

</header>


<div class="wrap">

<div class="panel">


<!-- =====================================================
     START CHAT
====================================================== -->

<section
  id="start"
  class="start">

  <h1>
    Who would you like to connect with?
  </h1>

  <p class="muted">
    Choose one: OM or Krishna.
  </p>


  <div class="targets">

    <button
      id="omBtn"
      class="target"
      onclick="selectTarget('om')">

      <b>🟢 OM</b>
      <br>

      <span class="muted">
        Connect with OM
      </span>

    </button>


    <button
      id="krishnaBtn"
      class="target"
      onclick="selectTarget('krishna')">

      <b>🔵 Krishna</b>
      <br>

      <span class="muted">
        Connect with Krishna
      </span>

    </button>

  </div>


  <div
    id="restoreInfo"
    class="info"
    style="display:none">

    Restoring your previous conversation...

  </div>


  <div
    id="form"
    class="form">

    <input
      id="name"
      placeholder="Full Name *">

    <input
      id="email"
      type="email"
      placeholder="Email Address *">

    <input
      id="mobile"
      placeholder="Mobile Number *">

    <button
      class="gold"
      onclick="startChat()">

      Start Chat

    </button>


    <div
      id="error"
      class="error"
      style="display:none">
    </div>

  </div>

</section>


<!-- =====================================================
     CHAT WINDOW
====================================================== -->

<section
  id="chat"
  class="chat">


  <div class="chathead">

    <b id="title">
    </b>

    <div
      id="visitorInfo"
      class="muted">
    </div>

  </div>


  <div
    id="connection"
    class="connection">

    Connecting...

  </div>


  <div
    id="messages"
    class="messages">
  </div>


  <div class="composer">

    <input
      id="message"
      placeholder="Type a message..."
      onkeydown="if(event.key==='Enter') sendMessage()">

    <button
      class="gold"
      onclick="sendMessage()">

      Send

    </button>

  </div>


</section>


</div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://keehbqlaxiojtkpldgry.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_lF6xTN15-1DNx_mszaZdJQ_QHlIj10T";


/* =========================================================
   IMPORTANT
   PUBLIC CHAT HAS ITS OWN AUTH STORAGE.

   OM / KRISHNA LOGIN USES THEIR NORMAL SESSION.

   PUBLIC CHAT USES:
   omkrishna_public_chat_auth
========================================================= */

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        storageKey:
          "omkrishna_public_chat_auth",

        persistSession:true,

        autoRefreshToken:true,

        detectSessionInUrl:false
      }
    }
  );


/* =========================================================
   STATE
========================================================= */

let target = null;

let conversationId = null;

let userId = null;

let channel = null;


/*
 * Browser local storage for the public conversation.
 */

const CHAT_STORAGE_KEY =
  "omkrishna_public_chat_state";


/* =========================================================
   ELEMENTS
========================================================= */

const startEl =
  document.getElementById("start");

const chatEl =
  document.getElementById("chat");

const formEl =
  document.getElementById("form");

const errorEl =
  document.getElementById("error");

const messagesEl =
  document.getElementById("messages");

const titleEl =
  document.getElementById("title");

const connectionEl =
  document.getElementById("connection");

const nameEl =
  document.getElementById("name");

const emailEl =
  document.getElementById("email");

const mobileEl =
  document.getElementById("mobile");

const messageEl =
  document.getElementById("message");


/* =========================================================
   ERROR
========================================================= */

function showError(text){

  errorEl.textContent =
    text;

  errorEl.style.display =
    "block";

}


/* =========================================================
   SELECT TARGET
========================================================= */

function selectTarget(t){

  target = t;

  document
    .getElementById("omBtn")
    .classList.toggle(
      "selected",
      t === "om"
    );

  document
    .getElementById("krishnaBtn")
    .classList.toggle(
      "selected",
      t === "krishna"
    );

  formEl.style.display =
    "grid";

}


/* =========================================================
   GET / CREATE PUBLIC ANONYMOUS SESSION
========================================================= */

async function getPublicUser(){

  /*
   * Because this client has its own
   * storageKey, this session is completely
   * separate from OM/Krishna login.
   */

  const {
    data,
    error
  } =
    await sb.auth.getSession();


  if(error){

    throw error;

  }


  if(data.session){

    return data.session.user;

  }


  const {
    data:anonymousData,
    error:anonymousError
  } =
    await sb.auth.signInAnonymously();


  if(anonymousError){

    throw anonymousError;

  }


  return anonymousData.user;

}


/* =========================================================
   SAVE STATE
========================================================= */

function saveState(){

  const state = {

    conversationId:
      conversationId,

    target:
      target,

    name:
      nameEl.value.trim(),

    email:
      emailEl.value.trim(),

    mobile:
      mobileEl.value.trim()

  };


  localStorage.setItem(
    CHAT_STORAGE_KEY,
    JSON.stringify(state)
  );

}


/* =========================================================
   GET SAVED STATE
========================================================= */

function getSavedState(){

  try{

    const value =
      localStorage.getItem(
        CHAT_STORAGE_KEY
      );

    if(!value){

      return null;

    }

    return JSON.parse(value);

  }

  catch(error){

    console.error(
      "Saved state error:",
      error
    );

    return null;

  }

}


/* =========================================================
   SHOW CHAT
========================================================= */

function showChat(){

  startEl.style.display =
    "none";

  chatEl.style.display =
    "grid";


  titleEl.textContent =
    "Chat with " +
    (
      target === "om"
        ? "OM"
        : "Krishna"
    );


  document
    .getElementById(
      "visitorInfo"
    )
    .textContent =

      nameEl.value.trim()
      + " • "
      + emailEl.value.trim()
      + " • "
      + mobileEl.value.trim();

}


/* =========================================================
   FIND CHAT TARGET
========================================================= */

async function getChatTarget(){

  const {
    data,
    error
  } =
    await sb

      .from("chat_targets")

      .select(
        "target_key,user_id,display_name,active"
      )

      .eq(
        "target_key",
        target
      )

      .eq(
        "active",
        true
      )

      .maybeSingle();


  if(error){

    throw error;

  }


  if(!data){

    throw new Error(
      "Selected chat representative is not available."
    );

  }


  return data;

}


/* =========================================================
   START NEW CHAT
========================================================= */

async function startChat(){

  errorEl.style.display =
    "none";


  const name =
    nameEl.value.trim();

  const email =
    emailEl.value.trim();

  const mobile =
    mobileEl.value.trim();


  if(
    !target ||
    !name ||
    !email ||
    !mobile
  ){

    showError(
      "Please select OM/Krishna and enter Full Name, Email and Mobile."
    );

    return;

  }


  try{

    /*
     * PUBLIC ANONYMOUS USER
     */

    const publicUser =
      await getPublicUser();


    userId =
      publicUser.id;


    /*
     * FIND OM OR KRISHNA PROFILE
     *
     * IMPORTANT:
     * target_user_id is now explicitly saved.
     */

    const chatTarget =
      await getChatTarget();


    /*
     * CREATE CONVERSATION
     */

    const {
      data,
      error
    } =
      await sb

        .from("conversations")

        .insert({

          conversation_type:
            "public",

          public_target:
            target,

          public_name:
            name,

          public_email:
            email,

          public_mobile:
            mobile,

          created_by:
            publicUser.id,

          target_user_id:
            chatTarget.user_id

        })

        .select(
          "id,target_user_id,created_by"
        )

        .single();


    if(error){

      throw error;

    }


    /*
     * VERIFY DATABASE RESULT
     */

    if(
      data.created_by !==
      publicUser.id
    ){

      throw new Error(
        "Conversation security verification failed."
      );

    }


    if(
      data.target_user_id !==
      chatTarget.user_id
    ){

      throw new Error(
        "Chat target verification failed."
      );

    }


    conversationId =
      data.id;


    /*
     * SAVE FOR REFRESH
     */

    saveState();


    showChat();


    await loadMessages();

    subscribeRealtime();


    messageEl.focus();

  }

  catch(error){

    console.error(
      "START CHAT ERROR:",
      error
    );

    showError(
      error.message ||
      "Unable to start chat."
    );

  }

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  if(!conversationId){

    return;

  }


  const {
    data,
    error
  } =
    await sb

      .from("messages")

      .select(
        "id,conversation_id,sender_id,sender_name,message_text,message_type,created_at"
      )

      .eq(
        "conversation_id",
        conversationId
      )

      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "LOAD MESSAGE ERROR:",
      error
    );

    showError(
      error.message
    );

    return;

  }


  messagesEl.innerHTML =
    "";


  (data || []).forEach(
    addMessage
  );

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeRealtime(){

  if(!conversationId){

    return;

  }


  /*
   * Remove previous channel.
   */

  if(channel){

    sb.removeChannel(
      channel
    );

    channel = null;

  }


  connectionEl.textContent =
    "Connecting...";


  const channelName =
    "public-chat-" +
    conversationId;


  channel =
    sb

      .channel(
        channelName
      )

      .on(

        "postgres_changes",

        {
          event:"INSERT",

          schema:"public",

          table:"messages",

          filter:
            "conversation_id=eq." +
            conversationId
        },

        payload => {

          console.log(
            "REALTIME MESSAGE:",
            payload.new
          );


          /*
           * If message is from OM/Krishna,
           * it will be added here.
           *
           * Own public message is already
           * displayed by sendMessage().
           */

          if(
            payload.new.sender_id !==
            userId
          ){

            addMessage(
              payload.new
            );

          }

        }

      )

      .subscribe(

        status => {

          console.log(
            "REALTIME STATUS:",
            status
          );


          if(
            status ===
            "SUBSCRIBED"
          ){

            connectionEl.textContent =
              "Live • Connected";

          }

          else if(
            status ===
            "CHANNEL_ERROR"
          ){

            connectionEl.textContent =
              "Live • Connection error";

          }

          else if(
            status ===
            "TIMED_OUT"
          ){

            connectionEl.textContent =
              "Live • Timed out";

          }

          else{

            connectionEl.textContent =
              "Live • " +
              status;

          }

        }

      );

}


/* =========================================================
   SEND PUBLIC MESSAGE
========================================================= */

async function sendMessage(){

  const text =
    messageEl.value.trim();


  if(!text){

    return;

  }


  if(
    !conversationId ||
    !userId
  ){

    alert(
      "Chat session is not ready."
    );

    return;

  }


  const {
    data,
    error
  } =
    await sb

      .from("messages")

      .insert({

        conversation_id:
          conversationId,

        sender_id:
          userId,

        sender_name:
          nameEl.value.trim(),

        message_text:
          text,

        message_type:
          "text"

      })

      .select(
        "id,conversation_id,sender_id,sender_name,message_text,message_type,created_at"
      )

      .single();


  if(error){

    console.error(
      "SEND MESSAGE ERROR:",
      error
    );

    alert(
      error.message
    );

    return;

  }


  /*
   * Show own message immediately.
   */

  addMessage(
    data
  );


  messageEl.value =
    "";

}


/* =========================================================
   DISPLAY MESSAGE
========================================================= */

function addMessage(m){

  if(!m){

    return;

  }


  /*
   * Prevent duplicate messages.
   */

  if(m.id){

    const existing =
      document.querySelector(
        '[data-message-id="' +
        m.id +
        '"]'
      );


    if(existing){

      return;

    }

  }


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "msg " +
    (
      m.sender_id === userId
        ? "mine"
        : ""
    );


  if(m.id){

    wrapper.dataset.messageId =
      m.id;

  }


  const sender =
    document.createElement(
      "div"
    );


  sender.className =
    "sender";


  sender.textContent =
    m.sender_name ||
    (
      m.sender_id === userId
        ? nameEl.value.trim()
        : "OM / Krishna"
    );


  const body =
    document.createElement(
      "div"
    );


  body.textContent =
    m.message_text ||
    "";


  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "meta";


  meta.textContent =
    m.created_at
      ? new Date(
          m.created_at
        ).toLocaleString(
          "en-IN"
        )
      : "";


  wrapper.append(
    sender,
    body,
    meta
  );


  messagesEl.appendChild(
    wrapper
  );


  messagesEl.scrollTop =
    messagesEl.scrollHeight;

}


/* =========================================================
   RESTORE AFTER REFRESH
========================================================= */

async function restoreChat(){

  const saved =
    getSavedState();


  if(
    !saved ||
    !saved.conversationId
  ){

    return;

  }


  document
    .getElementById(
      "restoreInfo"
    )
    .style.display =
      "block";


  try{

    /*
     * Get the SAME public anonymous
     * session from the separate storage.
     */

    const publicUser =
      await getPublicUser();


    userId =
      publicUser.id;


    /*
     * Verify that the conversation
     * belongs to this public user.
     */

    const {
      data:conversation,
      error
    } =
      await sb

        .from("conversations")

        .select(`
          id,
          conversation_type,
          public_target,
          public_name,
          public_email,
          public_mobile,
          created_by,
          target_user_id
        `)

        .eq(
          "id",
          saved.conversationId
        )

        .eq(
          "created_by",
          publicUser.id
        )

        .maybeSingle();


    if(error){

      throw error;

    }


    /*
     * Conversation does not belong to
     * current public anonymous session.
     */

    if(!conversation){

      localStorage.removeItem(
        CHAT_STORAGE_KEY
      );


      document
        .getElementById(
          "restoreInfo"
        )
        .style.display =
          "none";


      return;

    }


    /*
     * Restore values.
     */

    conversationId =
      conversation.id;

    target =
      conversation.public_target;


    nameEl.value =
      conversation.public_name ||
      saved.name ||
      "";


    emailEl.value =
      conversation.public_email ||
      saved.email ||
      "";


    mobileEl.value =
      conversation.public_mobile ||
      saved.mobile ||
      "";


    document
      .getElementById(
        "restoreInfo"
      )
      .style.display =
        "none";


    showChat();


    await loadMessages();

    subscribeRealtime();


  }

  catch(error){

    console.error(
      "RESTORE ERROR:",
      error
    );


    document
      .getElementById(
        "restoreInfo"
      )
      .style.display =
        "none";

  }

}


/* =========================================================
   PAGE START
========================================================= */

restoreChat();

</script>

</body>

</html>
